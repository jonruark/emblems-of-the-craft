#frame{padding:10px;background:linear-gradient(#2a2640,#1a1728);border-radius:14px;box-shadow:0 0 0 2px #c9a03a55,0 18px 50px #000a}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:4px}
#help{margin-top:12px;font-size:8px;line-height:14px;letter-spacing:1px;text-align:center;opacity:.75}

body.touch #pad{display:flex}

#dpad{position:relative;width:132px;height:132px}

#dpad .u{left:44px;top:0}#dpad .d{left:44px;bottom:0}#dpad .l{left:0;top:44px}#dpad .r{right:0;top:44px}

#ab{position:relative;width:130px;height:110px}

#ab .a{right:0;top:6px}#ab .b{left:0;bottom:6px}
#pad button{font-family:'PS2P',monospace;color:#e8d9a8;background:#3a3456;border:2px solid #57507a;border-radius:8px;box-shadow:0 3px 0 #17141f;touch-action:none}
#ab button{border-radius:50%;background:#7a2f3a;border-color:#a8505c}
#pad button.on{transform:translateY(2px);box-shadow:none;filter:brightness(1.25)}

<body>
<div id="frame"><canvas id="screen"></canvas></div>
<div id="help">ARROWS/WASD MOVE &nbsp;|&nbsp; Z/SPACE = A &nbsp;|&nbsp; X/ESC = B &nbsp;|&nbsp; ENTER = MENU &nbsp;|&nbsp; M = SOUND</div>
<div id="pad">
  <div id="dpad"><button class="u" data-b="up">&#9650;</button><button class="l" data-b="left">&#9664;</button><button class="c"></button><button class="r" data-b="right">&#9654;</button><button class="d" data-b="down">&#9660;</button></div>
  <div id="mid"><button data-b="start">START</button><button data-b="mute">SOUND</button></div>
  <div id="ab"><button class="b" data-b="b">B</button><button class="a" data-b="a">A</button></div>
</div>
<script>
'use strict';
/* ================= CORE: canvas, input, audio, font, UI primitives ================= */
const W = 256, H = 224, TS = 16;
const cv = document.getElementById('screen');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
let frameCount = 0;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

/* ---------- frame-based waiting for async scripts ---------- */
const waiters = [];
function frames(n) { return new Promise(r => waiters.push({ n: Math.max(1, n | 0), r })); }
function tickWaiters() { for (let i = waiters.length - 1; i >= 0; i--) { if (--waiters[i].n <= 0) { const w = waiters.splice(i, 1)[0]; w.r(); } } }

/* ---------- input ---------- */
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right', KeyZ: 'a', Space: 'a', KeyX: 'b', Escape: 'b', Backspace: 'b', Enter: 'start', KeyM: 'mute' };
const held = {}, pressed = {};
let typed = [];
function press(b) { if (!held[b]) pressed[b] = true; held[b] = true; audioInit(); }
function release(b) { held[b] = false; }
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length === 1 && /[a-zA-Z0-9 ]/.test(e.key)) typed.push(e.key.toUpperCase());
  if (e.code === 'Backspace') typed.push('\b');
  const b = KEYS[e.code];
  if (b) { e.preventDefault(); if (!e.repeat) press(b); }
});
addEventListener('keyup', e => { const b = KEYS[e.code]; if (b) release(b); });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
document.querySelectorAll('#pad [data-b]').forEach(el => {
  const b = el.dataset.b;
  const dn = e => { e.preventDefault(); el.classList.add('on'); press(b); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const up = e => { e.preventDefault(); el.classList.remove('on'); release(b); };
  el.addEventListener('pointerdown', dn); el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', () => audioInit());
const hit = b => !!pressed[b];
const OK = () => !!(pressed.a || pressed.start);

/* ---------- layout ---------- */
function fit() {
  const touch = matchMedia('(pointer:coarse)').matches;
  document.body.classList.toggle('touch', touch);
  const availW = innerWidth - 24, availH = innerHeight - (touch ? 200 : 60);
  let s = Math.min(availW / W, availH / H);
  if (s >= 2) s = Math.floor(s * 2) / 2;
  s = Math.max(1, s);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- audio ---------- */
let AC = null, master = null, musicBus = null, muted = false;
try { muted = localStorage.getItem('eotc-muted') === '1'; } catch (e) {}
const VOL = 0.16;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : VOL; master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
    if (wantSong) playMusic(wantSong, true);
  } catch (e) { AC = null; }
}
function setMute(m) { muted = m; if (master) master.gain.value = m ? 0 : VOL; try { localStorage.setItem('eotc-muted', m ? '1' : '0'); } catch (e) {} }
const NI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
function nfreq(n) { const m = /^([A-G]#?)(\d)$/.exec(n); if (!m) return 0; const midi = (+m[2] + 1) * 12 + NI[m[1]]; return 440 * Math.pow(2, (midi - 69) / 12); }
function tone(f, t, dur, wave, vol, dest, slideTo) {
  if (!AC || !f) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave || 'square'; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.setValueAtTime(vol, t + Math.max(0.012, dur * 0.65)); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(t, dur, vol) {
  if (!AC) return;
  const len = Math.max(1, Math.floor(AC.sampleRate * dur)), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(); s.buffer = buf; const g = AC.createGain(); g.gain.value = vol; s.connect(g); g.connect(master); s.start(t);
}
const now = () => AC ? AC.currentTime : 0;
const SFX = {
  blip() { tone(1046, now(), 0.025, 'square', 0.08); },
  sel() { const t = now(); tone(784, t, 0.04, 'square', 0.2); tone(1175, t + 0.045, 0.06, 'square', 0.2); },
  back() { const t = now(); tone(587, t, 0.04, 'square', 0.18); tone(392, t + 0.045, 0.06, 'square', 0.18); },
  bump() { tone(98, now(), 0.07, 'square', 0.25); },
  door() { const t = now(); noise(t, 0.12, 0.25); tone(220, t, 0.1, 'triangle', 0.4, null, 110); },
  alert() { const t = now(); tone(1318, t, 0.07, 'square', 0.25); tone(1760, t + 0.08, 0.12, 'square', 0.25); },
  hit() { const t = now(); noise(t, 0.16, 0.45); tone(240, t, 0.12, 'square', 0.25, null, 70); },
  big() { const t = now(); noise(t, 0.28, 0.6); tone(330, t, 0.22, 'square', 0.3, null, 55); },
  weak() { const t = now(); noise(t, 0.08, 0.25); },
  faint() { tone(784, now(), 0.6, 'square', 0.25, null, 70); },
  up() { const t = now(); [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * 0.05, 0.06, 'square', 0.18)); },
  down() { const t = now(); [784, 659, 523, 392].forEach((f, i) => tone(f, t + i * 0.05, 0.06, 'square', 0.18)); },
  heal() { const t = now(); [659, 784, 988, 1318].forEach((f, i) => tone(f, t + i * 0.07, 0.1, 'triangle', 0.4)); },
  throw() { tone(400, now(), 0.25, 'square', 0.15, null, 1200); },
  shake() { const t = now(); tone(220, t, 0.05, 'square', 0.25); tone(180, t + 0.08, 0.05, 'square', 0.25); },
  poof() { const t = now(); noise(t, 0.2, 0.35); tone(900, t, 0.2, 'triangle', 0.3, null, 300); },
  run() { const t = now(); [600, 500, 400].forEach((f, i) => tone(f, t + i * 0.06, 0.05, 'square', 0.15)); },
  evo() { const t = now(); for (let i = 0; i < 8; i++) tone(400 + i * 90, t + i * 0.06, 0.05, 'triangle', 0.3); }
};

/* ---------- music sequencer ---------- */
let wantSong = null, cur = null;
function parseTrack(s) { return s.trim().split(/\s+/).map(tok => { const [n, l] = tok.split('-'); return [n === '.' ? null : n, l ? +l : 1]; }); }
function playMusic(name, force) {
  wantSong = name;
  if (!name) { stopMusic(); return; }
  if (!force && cur && cur.name === name) return;
  if (!AC) return;
  stopMusic();
  const s = SONGS[name]; if (!s) return;
  const bus = AC.createGain(); bus.gain.value = 1; bus.connect(musicBus);
  const t0 = AC.currentTime + 0.06;
  cur = { name, bus, loop: s.loop !== false, unit: 60 / s.bpm / 2, tracks: s.tracks.map(t => ({ notes: parseTrack(t.n), wave: t.w, vol: t.v, i: 0, time: t0 })), end: 0 };
}
function stopMusic() { if (cur) { try { cur.bus.gain.setValueAtTime(0, AC.currentTime); cur.bus.disconnect(); } catch (e) {} } cur = null; }
function musicTick() {
  if (!AC || !cur) return;
  const ahead = AC.currentTime + 0.3;
  for (const tr of cur.tracks) {
    while (tr.time < ahead) {
      if (tr.i >= tr.notes.length) { if (!cur.loop) { tr.done = true; break; } tr.i = 0; }
      const [n, l] = tr.notes[tr.i++]; const d = l * cur.unit;
      if (n) tone(nfreq(n), tr.time, d * 0.9, tr.wave, tr.vol, cur.bus);
      tr.time += d;
    }
  }
}
setInterval(musicTick, 50);
/* one-shot jingle: pauses the song, resolves when done */
let jingleSeq = 0;
async function jingle(name) {
  const back = (cur && SONGS[cur.name] && SONGS[cur.name].loop === false) ? wantSongBeforeJingle : wantSong;
  if (!AC) { await frames(30); return; }
  const id = ++jingleSeq; wantSongBeforeJingle = back;
  playMusic(name, true);
  const s = SONGS[name]; const units = parseTrack(s.tracks[0].n).reduce((a, b) => a + b[1], 0);
  await frames(Math.ceil(units * 60 / s.bpm / 2 * 60) + 10);
  if (id === jingleSeq && cur && cur.name === name) playMusic(back, true);
}
let wantSongBeforeJingle = null;

/* ---------- pixel font (glyphs thresholded for crisp edges) ---------- */
const FONT = "'PS2P', monospace";
const glyphs = {};
function hexRgb(h) { if (h.length === 4) h = '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3]; const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function glyph(ch, col) {
  const k = col + ch; let c = glyphs[k]; if (c) return c;
  let g; [c, g] = mk(8, 8);
  g.font = '8px ' + FONT; g.textBaseline = 'top'; g.fillStyle = '#000'; g.fillText(ch, 0, 0);
  const d = g.getImageData(0, 0, 8, 8), [r, gg, b] = hexRgb(col);
  for (let i = 0; i < d.data.length; i += 4) { const on = d.data[i + 3] >= 110; d.data[i] = r; d.data[i + 1] = gg; d.data[i + 2] = b; d.data[i + 3] = on ? 255 : 0; }
  g.putImageData(d, 0, 0); glyphs[k] = c; return c;
}
const INK = '#26243a';
function txt(s, x, y, col, g) { g = g || ctx; col = col || INK; s = String(s); for (let i = 0; i < s.length; i++) { const ch = s[i]; if (ch !== ' ') g.drawImage(glyph(ch, col), x + i * 8, y); } }
function txtC(s, cx, y, col, g) { s = String(s); txt(s, Math.round(cx - s.length * 4), y, col, g); }
function txtR(s, rx, y, col, g) { s = String(s); txt(s, rx - s.length * 8, y, col, g); }
function txtBig(s, x, y, col, sc) { s = String(s); for (let i = 0; i < s.length; i++) if (s[i] !== ' ') ctx.drawImage(glyph(s[i], col), x + i * 8 * sc, y, 8 * sc, 8 * sc); }
function wrap(s, n) {
  const out = [];
  for (const para of s.split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      if (!line) line = w; else if ((line + ' ' + w).length > n) { out.push(line); line = w; } else line += ' ' + w;
    }
    out.push(line);
  }
  return out;
}

/* ---------- boxes & cursor ---------- */
function box(x, y, w, h, g) {
  g = g || ctx;
  g.fillStyle = '#26243a'; g.fillRect(x, y + 1, w, h - 2); g.fillRect(x + 1, y, w - 2, h);
  g.fillStyle = '#c9a03a'; g.fillRect(x + 2, y + 2, w - 4, h - 4);
  g.fillStyle = '#26243a'; g.fillRect(x + 3, y + 3, w - 6, h - 6);
  g.fillStyle = '#fbf6e6'; g.fillRect(x + 4, y + 4, w - 8, h - 8);
}
function cursor(x, y, col) { ctx.fillStyle = col || INK; for (let i = 0; i < 4; i++) ctx.fillRect(x + i, y + i, 1, 7 - i * 2); }
function arrowDown(x, y) { ctx.fillStyle = '#b8402e'; for (let i = 0; i < 4; i++) ctx.fillRect(x + i, y + i, 7 - i * 2, 1); }

/* ---------- modal stack ---------- */
const modals = [];
function pushModal(m) { modals.push(m); return m; }
function popModal(m) { const i = modals.indexOf(m); if (i >= 0) modals.splice(i, 1); }
function fmt(s) { return String(s).replace(/\{NAME\}/g, (G && G.name) || 'SEEKER'); }

/* say(text, {auto:frames, keep:true}) */
function say(text, o) {
  o = o || {};
  return new Promise(res => {
    const lines = wrap(fmt(text), 29), pages = [];
    for (let i = 0; i < lines.length; i += 3) pages.push(lines.slice(i, i + 3));
    let p = 0, c = 0, wait = 0;
    const total = () => pages[p].join('').length;
    const m = {
      tag: 'say',
      draw() {
        const y = H - 56; box(0, y, W, 56);
        let n = Math.floor(c);
        pages[p].forEach((ln, i) => { txt(ln.slice(0, Math.max(0, n)), 12, y + 11 + i * 14); n -= ln.length; });
        if (c >= total() && !o.keep && !o.auto && (frameCount >> 4) % 2) arrowDown(W - 18, H - 13);
      },
      update() {
        if (c < total()) {
          c += (held.a || held.b) ? 3 : 1.5;
          if (frameCount % 4 === 0) SFX.blip();
          if (c >= total() && o.keep && p === pages.length - 1) res(m);
          return;
        }
        if (o.keep && p === pages.length - 1) return;
        if (o.auto && p === pages.length - 1) { if (++wait >= o.auto || OK()) { popModal(m); res(m); } return; }
        if (OK() || hit('b')) {
          if (p < pages.length - 1) { p++; c = 0; } else { popModal(m); res(m); }
        }
      }
    };
    pushModal(m);
  });
}
/* generic vertical menu: resolves index, or -1 on cancel */
function menu(items, o) {
  o = o || {};
  return new Promise(res => {
    let i = o.start || 0;
    const w = o.w || (Math.max(...items.map(s => String(s).length)) * 8 + 30);
    const h = items.length * 16 + 12;
    const x = o.x != null ? o.x : W - w, y = o.y != null ? o.y : H - 56 - h;
    const m = {
      tag: 'menu',
      draw() { if (o.extra) o.extra(i); box(x, y, w, h); items.forEach((s, k) => txt(s, x + 18, y + 9 + k * 16)); cursor(x + 9, y + 9 + i * 16); },
      update() {
        if (hit('up')) { i = (i + items.length - 1) % items.length; SFX.blip(); }
        if (hit('down')) { i = (i + 1) % items.length; SFX.blip(); }
        if (OK()) { SFX.sel(); popModal(m); res(i); }
        else if (hit('b') && o.cancel !== false) { SFX.back(); popModal(m); res(-1); }
      }
    };
    pushModal(m);
  });
}
async function ask(text, opts) {
  opts = opts || ['YES', 'NO'];
  const m = await say(text, { keep: true });
  let r = await menu(opts);
  popModal(m);
  if (r < 0) r = opts.length - 1;
  return r;
}

/* ---------- fades ---------- */
let fade = 0, fadeCol = '#000';
async function fadeTo(t, n) { n = n || 12; const s = fade; for (let i = 1; i <= n; i++) { fade = s + (t - s) * i / n; await frames(1); } }

/* ================= ART: tiles, people, emblems (all drawn in code) ================= */
const C = {
  ink: '#26243a', white: '#fbf6e6',
  grass: '#8ccf72', grass2: '#6dba5c', grass3: '#a9e08a',
  tall: '#4f9e4a', tall2: '#2f7636', tall3: '#79c463',
  path: '#e8d3a0', path2: '#cdb07a', path3: '#f5e6bf',
  water: '#4a8fe0', water2: '#86c2f6', water3: '#336fc4',
  leaf: '#3f9a4c', leaf2: '#286f3a', leaf3: '#6cc260', bark: '#7a5232', bark2: '#553820',
  roofR: '#c8503c', roofR2: '#93352e', roofR3: '#e2805e',
  roofB: '#3d5fc0', roofB2: '#2a3f8a', roofB3: '#6d8de2',
  roofG: '#4a9a58', roofG2: '#2e6e3c', roofG3: '#7cc184',
  wall: '#efe0bc', wall2: '#c9b48a', wood: '#c88c52', wood2: '#9a6634', wood3: '#e2ad72',
  stone: '#b8b3ab', stone2: '#8d8880', stone3: '#ddd8d0', gold: '#e8b838', gold2: '#a87a1a', gold3: '#f8dc80',
  glass: '#a2d4f2', red: '#cf4848', blue: '#4462c4', navy: '#2a3470'
};
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function E(g, cx, cy, rx, ry, c) { g.fillStyle = c; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function Pg(g, p, c) { g.fillStyle = c; g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); g.fill(); }
function Ln(g, x0, y0, x1, y1, w, c) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function star(g, cx, cy, r1, r2, c, rot) {
  const p = []; rot = rot || -Math.PI / 2;
  for (let i = 0; i < 10; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / 5; p.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  Pg(g, p, c);
}
/* make edges hard and add a 1px ink outline */
function crisp(c, outline) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h), a = d.data;
  for (let i = 3; i < a.length; i += 4) a[i] = a[i] >= 120 ? 255 : 0;
  if (outline) {
    const on = i => a[i * 4 + 3] === 255, mark = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (on(i)) continue;
      if ((x > 0 && on(i - 1)) || (x < w - 1 && on(i + 1)) || (y > 0 && on(i - w)) || (y < h - 1 && on(i + w))) mark.push(i);
    }
    const [r, gg, b] = hexRgb(C.ink);
    for (const i of mark) { a[i * 4] = r; a[i * 4 + 1] = gg; a[i * 4 + 2] = b; a[i * 4 + 3] = 255; }
  }
  g.putImageData(d, 0, 0); return c;
}
function flipH(src) { const [c, g] = mk(src.width, src.height); g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c; }
function whiten(src) { const [c, g] = mk(src.width, src.height); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); return c; }

/* ================= WORLD: state, maps, movement, rendering ================= */

let MAP = null, npcs = [], busy = 0, mapBanner = 0;
const P = { moving: false, ox: 0, oy: 0, walkF: 0, turnT: 0, lastMove: -99, bumpT: 0 };

function newGame() {

    wages: 300, flags: {}, seen: {}, caught: {}, tools: 0, time: 0, hall: { map: 'hall', x: 4, y: 3 } };

function saveGame() { try { localStorage.setItem('eotc-save', JSON.stringify(G)); return true; } catch (e) { return false; } }

function run(fn) { busy++; Promise.resolve().then(fn).catch(e => console.error(e)).finally(() => { busy--; }); }

function loadMap(id, x, y, dir) {

function refreshNpcs() { const keep = {}; npcs.forEach(n => keep[n.id] = n); npcs = (MAP.npcs || []).filter(n => !n.show || n.show()).map(n => keep[n.id] || Object.assign({}, n, { dir: n.dir || 'down', ox: 0, oy: 0, hx: n.x, hy: n.y, wt: rnd(60, 220), bubble: 0 })); }
function tileAt(x, y) { const t = MAP.tiles; if (y < 0 || y >= t.length || x < 0 || x >= t[0].length) return MAP.border || 'V'; return t[y][x]; }
function npcAt(x, y) { return npcs.find(n => n.x === x && n.y === y && !n.ghost); }

/* ---------- per-frame world logic ---------- */
function worldAnim() {
  for (const n of npcs) {
    if (n.ox) n.ox -= Math.sign(n.ox) * 2;
    if (n.oy) n.oy -= Math.sign(n.oy) * 2;
    if (n.bubble > 0) n.bubble--;
  }
  if (P.moving) {
    P.ox -= Math.sign(P.ox) * 2; P.oy -= Math.sign(P.oy) * 2;
    if (!P.ox && !P.oy) { P.moving = false; P.lastMove = frameCount; onStep(); }
  }
  if (mapBanner > 0) mapBanner--;
  if (P.bumpT > 0) P.bumpT--;
}
function worldUpdate() {
  if (busy || modals.length || P.moving) return;
  for (const n of npcs) {
    if (!n.wander || n.ox || n.oy) continue;
    if (--n.wt > 0) continue;
    n.wt = rnd(90, 240);
    const d = pick(['up', 'down', 'left', 'right']), [dx, dy] = DIRS[d], nx = n.x + dx, ny = n.y + dy;
    n.dir = d;
    if (Math.abs(nx - n.hx) > 2 || Math.abs(ny - n.hy) > 2) continue;
    if (blocked(nx, ny) || (nx === G.x && ny === G.y) || tileAt(nx, ny) === 'D' || warpAt(nx, ny)) continue;
    n.x = nx; n.y = ny; n.ox = -dx * 16; n.oy = -dy * 16;
  }
  if (hit('start')) { SFX.sel(); run(startMenu); return; }
  if (hit('a')) { interact(); return; }
  const d = ['up', 'down', 'left', 'right'].find(k => held[k]);
  if (!d) { P.turnT = 0; return; }
  if (d !== G.dir) {
    G.dir = d;
    if (frameCount - P.lastMove > 2) { P.turnT = 6; return; }
  }
  if (P.turnT > 0) { P.turnT--; return; }
  const w = warpAt(G.x, G.y);
  if (w && w.mat === d) { run(() => doWarp(w)); return; }
  tryMove(d);
}
function tryMove(d) {
  const [dx, dy] = DIRS[d], nx = G.x + dx, ny = G.y + dy;
  if (blocked(nx, ny)) { if (P.bumpT === 0) { SFX.bump(); P.bumpT = 18; } return; }
  G.x = nx; G.y = ny; P.ox = -dx * 16; P.oy = -dy * 16; P.moving = true; P.walkF ^= 1;
}
function onStep() {
  const w = warpAt(G.x, G.y);
  if (w && !w.manual) { run(() => doWarp(w)); return; }
  const tr = (MAP.triggers || []).find(t => t.x === G.x && t.y === G.y && (!t.when || t.when()));
  if (tr) { run(tr.run); return; }
  if (checkSight()) return;
  if (tileAt(G.x, G.y) === ',' && MAP.grass && lead() && Math.random() < MAP.grass.rate) run(wildEncounter);
}
async function doWarp(w) {
  SFX.door(); await fadeTo(1, 8);
  loadMap(w.to, w.tx, w.ty, w.dir || G.dir);
  await frames(4); await fadeTo(0, 8);
}
function interact() {
  const [dx, dy] = DIRS[G.dir]; let tx = G.x + dx, ty = G.y + dy;
  let n = npcAt(tx, ty);
  if (!n && tileAt(tx, ty) === 'C') n = npcAt(tx + dx, ty + dy);
  if (n) { run(() => talkTo(n)); return; }
  const s = MAP.signs && MAP.signs[tx + ',' + ty];
  if (s) run(() => typeof s === 'function' ? s() : say(s));
}
async function talkTo(n) {
  if (!n.object) n.dir = OPP[G.dir];
  if (n.trainer && !G.flags['tr_' + n.id]) { await trainerBattle(n); return; }
  if (n.talk) await n.talk(n);
  else if (n.text) { for (const t of [].concat(typeof n.text === 'function' ? n.text() : n.text)) await say(t); }
}
/* trainers who spot you */
function checkSight() {
  for (const n of npcs) {
    if (!n.trainer || !n.sight || G.flags['tr_' + n.id]) continue;
    const [dx, dy] = DIRS[n.dir];
    for (let k = 1; k <= n.sight; k++) {
      const x = n.x + dx * k, y = n.y + dy * k;
      if (x === G.x && y === G.y) { run(() => spotted(n, k)); return true; }
      if (SOLID.has(tileAt(x, y)) || npcAt(x, y)) break;
    }
  }
  return false;
}
async function npcStep(n, d) { const [dx, dy] = DIRS[d]; n.dir = d; n.x += dx; n.y += dy; n.ox = -dx * 16; n.oy = -dy * 16; await frames(8); }
async function spotted(n, k) {
  n.bubble = 45; SFX.alert(); playMusic(n.trainer.boss ? 'boss' : 'battle');
  await frames(45);
  for (let i = 1; i < k; i++) await npcStep(n, n.dir);
  G.dir = OPP[n.dir];
  await trainerBattle(n);
}
async function trainerBattle(n) {
  const t = n.trainer;
  for (const line of [].concat(t.intro)) await say(line);
  const r = await battle({ trainer: t, npc: n });
  if (r === 'win') {

}
async function giveItem(id, qty, silent) {

}
function healAll() { for (const m of G.party) m.hp = stat(m, 'hp'); }

/* ---------- rendering ---------- */
function camera() { return [G.x * 16 + P.ox + 8 - W / 2, G.y * 16 + P.oy + 8 - H / 2]; }
function drawPerson(look, dir, frame, x, y) { ctx.drawImage(sheet(look)[dir][frame], x, y); }
function drawWorld() {
  const [cx, cy] = camera();

  for (let ty = ty0; ty <= ty0 + 15; ty++) for (let tx = tx0; tx <= tx0 + 17; tx++) ctx.drawImage(tileImg(tileAt(tx, ty)), tx * 16 - cx, ty * 16 - cy);
  const ents = npcs.filter(n => !n.ghost).map(n => ({ n, y: n.y * 16 + n.oy })); ents.push({ n: null, y: G.y * 16 + P.oy });
  ents.sort((a, b) => a.y - b.y);
  for (const { n } of ents) {
    if (n) {
      const x = n.x * 16 + n.ox - cx, y = n.y * 16 + n.oy - cy;
      if (n.object) ctx.drawImage(objSprite(n.object), x, y);
      else { const f = (n.ox || n.oy) ? (Math.abs(n.ox + n.oy) > 6 ? 1 + ((n.x + n.y) & 1) : 0) : 0; drawPerson(n.look, n.dir, f, x, y - 4); }
      if (tileAt(n.x, n.y) === ',' && !n.ox && !n.oy) ctx.drawImage(tileImg(','), 0, 9, 16, 7, x, y + 9, 16, 7);
      if (n.bubble > 0) { const bx = x + 3, by = y - 17; ctx.fillStyle = C.ink; ctx.fillRect(bx, by, 11, 12); ctx.fillStyle = '#fff'; ctx.fillRect(bx + 1, by + 1, 9, 10); ctx.fillStyle = C.red; ctx.fillRect(bx + 4, by + 2, 3, 5); ctx.fillRect(bx + 4, by + 8, 3, 2); }
    } else {
      const x = G.x * 16 + P.ox - cx, y = G.y * 16 + P.oy - cy;
      const f = P.moving && (Math.abs(P.ox) + Math.abs(P.oy)) > 6 ? 1 + P.walkF : 0;
      drawPerson(PLAYER_LOOK, G.dir, f, x, y - 4);
      if (tileAt(G.x, G.y) === ',' && !P.moving) ctx.drawImage(tileImg(','), 0, 9, 16, 7, x, y + 9, 16, 7);
    }
  }
  if (mapBanner > 0 && MAP.title) {
    const yy = mapBanner > 95 ? -40 + (110 - mapBanner) * 3 : mapBanner < 15 ? -40 + mapBanner * 3 : 4;
    const w = MAP.title.length * 8 + 24; box(4, yy, w, 26); txt(MAP.title, 16, yy + 9);
  }
}

/* ================= BATTLE ================= */
let B = null;
const xpFor = lv => lv * lv * lv;
function stat(m, k) {
  const b = SP[m.sp].base;
  if (k === 'hp') return Math.floor(2 * b[0] * m.lv / 100) + m.lv + 10;
  return Math.floor(2 * b[{ atk: 1, def: 2, spd: 3 }[k]] * m.lv / 100) + 5;
}
function makeMon(sp, lv) {
  const m = { sp, lv, xp: xpFor(lv), moves: [] };
  for (const [l, mv] of SP[sp].learn) if (l <= lv && !m.moves.includes(mv)) { m.moves.push(mv); if (m.moves.length > 4) m.moves.shift(); }
  m.hp = stat(m, 'hp'); return m;
}
const nm = m => SP[m.sp].name;
const stageMul = s => s >= 0 ? (2 + s) / 2 : 2 / (2 - s);
const stg = () => ({ atk: 0, def: 0, spd: 0 });
const other = s => s === 'ally' ? 'foe' : 'ally';
function mon(side) { return side === 'ally' ? B.ally : B.foe; }
function pre(side) { return side === 'ally' ? '' : (B.wild ? 'Wild ' : 'Foe '); }
function effSpd(side) { return stat(mon(side), 'spd') * stageMul(B.st[side].spd); }
function markSeen(m) { G.seen[m.sp] = 1; }

async function wildEncounter() {
  const tb = MAP.grass.table, tot = tb.reduce((a, r) => a + r[3], 0);
  let r = Math.random() * tot, row = tb[0];
  for (const t of tb) { if ((r -= t[3]) < 0) { row = t; break; } }
  await battle({ wild: makeMon(row[0], rnd(row[1], row[2])) });
}

async function battleIntroFx() {
  fadeCol = '#fff';
  for (let i = 0; i < 3; i++) { await fadeTo(0.85, 4); await fadeTo(0, 4); }
  fadeCol = '#000'; await fadeTo(1, 10);
}
async function battle(o) {
  const tr = o.trainer || null, wild = o.wild || null;
  B = { wild, tr, foes: wild ? [wild] : tr.team.map(([s, l]) => makeMon(s, l)), foe: null, ally: null, st: { ally: stg(), foe: stg() }, disp: { ally: 0, foe: 0 }, runs: 0, lastAct: 0, lastMove: 0,
    a: { foeX: 140, allyX: -140, trX: 140, plX: -140, foeVis: false, allyVis: false, trVis: !!tr, plVis: true, foeDrop: 0, allyDrop: 0, shake: { ally: 0, foe: 0 }, lunge: { ally: 0, foe: 0 }, white: { ally: 0, foe: 0 }, board: null, boxes: false } };
  playMusic(tr ? (tr.boss ? 'boss' : 'battle') : 'battle');
  await battleIntroFx();
  scene = 'battle'; B.foe = B.foes[0];
  if (wild) B.a.foeVis = true;
  await fadeTo(0, 10);
  for (let i = 0; i < 28; i++) { B.a.foeX = Math.max(0, B.a.foeX - 5); B.a.trX = Math.max(0, B.a.trX - 5); B.a.plX = Math.min(0, B.a.plX + 5); await frames(1); }
  B.a.foeX = B.a.trX = B.a.plX = 0;
  if (wild) { markSeen(B.foe); await say(`A wild ${nm(B.foe)} appeared!`); }
  else {
    await say(`${tr.title} ${tr.name} wants to test your work!`);
    for (let i = 0; i < 20; i++) { B.a.trX += 6; await frames(1); } B.a.trVis = false;
    await sendFoe(B.foe, true);
  }
  for (let i = 0; i < 20; i++) { B.a.plX -= 6; await frames(1); } B.a.plVis = false;
  await sendAlly(lead());
  B.a.boxes = true;
  let res = null;
  while (!res) res = await turn();
  return await endBattle(res, o);
}
async function sendFoe(m, first) {
  B.foe = m; markSeen(m); B.st.foe = stg(); B.disp.foe = m.hp; B.a.foeDrop = 0; B.a.foeX = 0;
  if (!first) {}
  await say(`${B.tr.title} ${B.tr.name} sent out ${nm(m)}!`, { auto: 20 });
  B.a.foeVis = true; SFX.poof(); B.a.white.foe = 10; await frames(12);
}
async function sendAlly(m) {
  B.ally = m; B.st.ally = stg(); B.disp.ally = m.hp; B.a.allyDrop = 0; B.a.allyX = 0;
  await say(`Go! ${nm(m)}!`, { auto: 16 });
  B.a.allyVis = true; SFX.poof(); B.a.white.ally = 10; await frames(12);
}
function battleAnim() {
  if (!B) return;
  const a = B.a;
  for (const s of ['ally', 'foe']) {
    if (a.shake[s] > 0) a.shake[s]--; if (a.white[s] > 0) a.white[s]--;
    if (a.lunge[s] > 0) a.lunge[s]--;
    const m = mon(s); if (!m) continue;
    const d = B.disp[s], t = m.hp;
    if (d !== t) { const step = Math.max(0.35, stat(m, 'hp') / 45); B.disp[s] = Math.abs(t - d) <= step ? t : d + Math.sign(t - d) * step; }
  }
}
async function waitHp() { while ((B.ally && B.disp.ally !== B.ally.hp) || (B.foe && B.disp.foe !== B.foe.hp)) await frames(1); }

/* ---------- action selection ---------- */
function gridMenu(items, o) {
  return new Promise(res => {
    let i = o.start || 0;
    const m = {
      tag: o.tag || 'grid',
      draw() {
        box(0, H - 56, W, 56);
        if (o.left) o.left();
        box(o.x, H - 56, W - o.x, 56);
        items.forEach((s, k) => { const cx = o.x + 10 + (k % 2) * o.cw, cy = H - 56 + 14 + Math.floor(k / 2) * 18; txt(s, cx + 10, cy); if (k === i) cursor(cx + 1, cy); });
      },
      update() {
        const r = i >> 1, c = i & 1; let n = i;
        if (hit('up') && r > 0) n -= 2; if (hit('down') && n + 2 < items.length) n += 2;
        if (hit('left') && c > 0) n--; if (hit('right') && c < 1 && n + 1 < items.length) n++;
        if (n !== i) { i = n; SFX.blip(); }
        if (OK()) { SFX.sel(); popModal(m); res(i); } else if (hit('b') && o.cancel) { SFX.back(); popModal(m); res(-1); }
      }
    };
    pushModal(m);
  });
}
async function moveMenu() {
  const mvs = B.ally.moves;
  const r = await menu(mvs.map(k => MV[k].name), {
    x: 96, y: H - (mvs.length * 16 + 12), w: 160, start: Math.min(B.lastMove, mvs.length - 1),
    extra(i) {
      const mv = MV[mvs[i]], y = H - 64; box(0, y, 96, 64);
      txt('TYPE/', 10, y + 10); txt(mv.type, 10, y + 22, TYPES[mv.type].col);
      txt(mv.pow ? 'POW ' + mv.pow : 'STATUS', 10, y + 36); txt('ACC ' + mv.acc, 10, y + 48);
      const mul = mv.pow ? typeMul(mv.type, SP[B.foe.sp].type) : 1;
      if (mul !== 1) { ctx.fillStyle = mul > 1 ? '#3f9a4c' : '#c8503c'; ctx.fillRect(78, y + 10, 8, 8); }
    }
  });
  if (r >= 0) B.lastMove = r;
  return r;
}
async function chooseAction() {
  for (;;) {
    const c = await gridMenu(['FIGHT', 'BAG', 'EMBLEM', 'RUN'], { x: 120, cw: 62, tag: 'action', start: B.lastAct, left() { txt('What will', 12, H - 44); txt(nm(B.ally), 12, H - 30); txt('do?', 12, H - 16); } });
    B.lastAct = c;
    if (c === 0) { const mi = await moveMenu(); if (mi < 0) continue; return { kind: 'move', mv: B.ally.moves[mi] }; }
    if (c === 1) {
      const it = await bagMenu({ battle: true }); if (!it) continue;
      if (it === 'board') { if (B.tr) { await say('The trainer blocks the board! You cannot claim another\'s Emblem.'); continue; } return { kind: 'board' }; }
      const ti = await partyMenu({ prompt: 'Use on which Emblem?' }); if (ti < 0) continue;
      if (!canUse(it, G.party[ti])) { await say('It won\'t have any effect.'); continue; }
      return { kind: 'item', item: it, i: ti };
    }
    if (c === 2) {
      const i = await partyMenu({ prompt: 'Send in which Emblem?' }); if (i < 0) continue;
      const m = G.party[i];
      if (m === B.ally) { await say(`${nm(m)} is already laboring!`); continue; }
      if (!alive(m)) { await say(`${nm(m)} has no strength left!`); continue; }
      return { kind: 'switch', i };
    }
    if (c === 3) return { kind: 'run' };
  }
}
function canUse(it, m) {
  const d = ITEMS[it];
  if (d.revive) return m.hp <= 0;
  if (d.heal) return m.hp > 0 && m.hp < stat(m, 'hp');
  return false;
}
async function applyItem(it, m) {
  G.bag[it]--;
  const d = ITEMS[it], max = stat(m, 'hp');
  if (d.revive) { m.hp = Math.floor(max / 2); SFX.heal(); await say(`${nm(m)} was anointed with OIL and revived!`); }
  else { const before = m.hp; m.hp = Math.min(max, m.hp + d.heal); SFX.heal(); if (B && m === B.ally) await waitHp(); await say(`${nm(m)} recovered ${m.hp - before} HP!`); }
}

/* ---------- turn ---------- */
function foeMove() {
  const f = B.foe, opts = [];
  for (const k of f.moves) {
    const mv = MV[k]; let w = 2;
    if (mv.heal) w = f.hp < stat(f, 'hp') * 0.4 ? 5 : 0;
    else if (!mv.pow) { const st = mv.self ? B.st.foe : B.st.ally, key = Object.keys(mv.self || mv.foe)[0]; w = Math.abs(st[key]) >= 2 ? 0 : 1; }
    else { const mul = typeMul(mv.type, SP[B.ally.sp].type); w = mul > 1 ? 4 : mul < 1 ? 1 : 2; if (mv.pow >= 60) w++; }
    opts.push([k, w]);
  }
  const tot = opts.reduce((a, b) => a + b[1], 0); if (!tot) return f.moves[0];
  let r = Math.random() * tot; for (const [k, w] of opts) if ((r -= w) < 0) return k;
  return f.moves[0];
}
async function turn() {
  const act = await chooseAction();
  if (act.kind === 'run') {
    if (B.tr) { await say('There is no running from a trial!'); return null; }
    B.runs++;
    if (effSpd('ally') >= effSpd('foe') || Math.random() < 0.45 + 0.2 * B.runs) { SFX.run(); await say('Got away safely!'); return 'run'; }
    await say('Couldn\'t get away!');
  } else if (act.kind === 'board') {
    G.bag.board--;
    if (await throwBoard()) return 'caught';
  } else if (act.kind === 'item') {
    await applyItem(act.item, G.party[act.i]);
  } else if (act.kind === 'switch') {
    await say(`Come back, ${nm(B.ally)}!`, { auto: 16 });
    B.a.allyVis = false; await frames(10);
    await sendAlly(G.party[act.i]);
  }
  if (act.kind === 'move') {
    const fm = foeMove();
    const a = effSpd('ally'), f = effSpd('foe');
    const allyFirst = a > f || (a === f && Math.random() < 0.5);
    const order = allyFirst ? [['ally', act.mv], ['foe', fm]] : [['foe', fm], ['ally', act.mv]];
    for (const [s, mv] of order) { const r = await doAct(s, mv); if (r === 'win' || r === 'lose') return r; if (r === 'stop') break; }
  } else {
    const r = await doAct('foe', foeMove()); if (r === 'win' || r === 'lose') return r;
  }
  return null;
}

}
async function afterHit() {

async function grantXp(m, amt) {

async function learnMove(m, k) {

async function throwBoard() {

  SFX.throw();
  const b = B.a.board = { x: 60, y: 120, r: 0 };
  for (let i = 0; i <= 24; i++) { const t = i / 24; b.x = 60 + (184 - 60) * t; b.y = 120 + (56 - 120) * t - Math.sin(t * Math.PI) * 50; b.r = i; await frames(1); }
  B.a.white.foe = 12; SFX.poof(); await frames(10); B.a.foeVis = false;
  for (let i = 0; i < 10; i++) { b.y += 2; await frames(1); } b.r = 0;

  let a = Math.floor((3 * max - 2 * f.hp) * SP[f.sp].cat / (3 * max)); a = clamp(a, 1, 255);

}

function nameEntry() {

    paper(); box(8, 8, W - 16, 40); txt('YOUR NAME?', 20, 18, '#8a7f62'); txt(name + ((frameCount >> 4) % 2 ? '_' : ' '), 20, 32);

    box(0, H - 48, W, 48); txt('Type, or use the arrows.', 12, H - 34, '#4a4636'); txt('Choose END when ready.', 12, H - 20, '#4a4636');
  }, done => {

async function degreeCeremony() {
  await say('WORSHIPFUL MASTER: Brother {NAME}, you have passed through the trial of the FIRST DEGREE.');
  await fadeTo(0.5, 16);
  await jingle('degree');
  await say('WORSHIPFUL MASTER: I now present you with the working tools of an ENTERED APPRENTICE: the TWENTY-FOUR INCH GAUGE and the COMMON GAVEL.');
  G.tools = 1; G.flags.tools = 1;
  await say('{NAME} received the GAUGE & GAVEL!');
  await fadeTo(0, 16);
  await say('WORSHIPFUL MASTER: The gauge divides your day: a portion for devotion and service, a portion for your labors, and a portion for rest.');
  await say('WORSHIPFUL MASTER: The gavel knocks the rough corners from the stone, as you must knock the vices from your own heart.');
  await say('WORSHIPFUL MASTER: But hear this. The ruffian JUBELA was seen here, and his brothers JUBELO and JUBELUM roam the land. They seek a WORD that must never be taken by force.');
  await say('WORSHIPFUL MASTER: Your labors are far from finished, Brother. Go forth, and seek further light.');
  healAll(); saveGame();
  await fadeTo(1, 20); scene = 'end'; playMusic('title'); await fadeTo(0, 20);
  let endT = 0;
  await fullModal(() => { if (endT > 90 && (frameCount >> 5) % 2) txtC('PRESS START', W / 2, 206, '#fbf6e6'); }, done => { if (++endT > 90 && OK()) done(); });
  await fadeTo(1, 20); scene = 'world'; playMusic(MAP.music, true); await fadeTo(0, 20);
  await say('Your progress was recorded. You may keep exploring, training, and filling your CODEX.');
}

/* ================= MAIN LOOP ================= */
function update() {
  frameCount++;
  tickWaiters();
  if (hit('mute') && scene !== 'boot') setMute(!muted);
  if (scene === 'world') { G.time++; worldAnim(); }
  if (scene === 'battle') { G.time++; battleAnim(); }
  const top = modals[modals.length - 1];
  if (top) top.update();
  else if (scene === 'world') worldUpdate();
  for (const k in pressed) pressed[k] = false;
  typed = [];
}
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (scene === 'title') drawTitle();
  else if (scene === 'intro') drawIntro();
  else if (scene === 'world') drawWorld();
  else if (scene === 'battle') drawBattle();
  else if (scene === 'evo') drawEvo();
  else if (scene === 'end') drawEnd();
  else if (scene === 'boot') { txtC('LOADING...', W / 2, H / 2, '#8a86c0'); }
  for (const m of modals) m.draw();
  if (fade > 0) { ctx.globalAlpha = Math.min(1, fade); ctx.fillStyle = fadeCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { update(); acc -= 1000 / 60; n++; }
  if (n) draw();
  requestAnimationFrame(loop);
}
async function boot() {
  try { await Promise.race([document.fonts.load('8px PS2P'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  for (const k in glyphs) delete glyphs[k];
  requestAnimationFrame(loop);
  await frames(2);
  run(titleScreen);
}
boot();
